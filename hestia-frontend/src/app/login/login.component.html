<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar sesión</h2>
    <form (ngSubmit)="login()">
      <input type="email" placeholder="Correo electrónico" [(ngModel)]="email" name="email" required />
      <input type="password" placeholder="Contraseña" [(ngModel)]="password" name="password" required />
      <button type="submit" [disabled]="loading">Entrar</button>
    </form>
    <div *ngIf="error" class="error">{{ error }}</div>
    <p>
      ¿No tienes cuenta?
      <a (click)="goToRegister()" class="register-link">Registrarse</a>
    </p>
    <div class="auth-links">
      <a (click)="goHome()" class="back-home">Volver a inicio</a>
    </div>
  </div>
</div>
