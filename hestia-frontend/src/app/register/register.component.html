<div class="auth-container">
  <div class="auth-card">
    <div *ngIf="success" class="success-alert" role="alert" aria-live="polite">
      <span class="success-icon">✔</span>
      Tu cuenta se registró con éxito.
      <a (click)="goToLogin()" class="success-link">Iniciar sesión</a>
    </div>

    <h2>Registrarse</h2>
    <form (ngSubmit)="register()">
      <input type="text" placeholder="Usuario" [(ngModel)]="username" name="username" required />
      <input type="email" placeholder="Correo electrónico" [(ngModel)]="email" name="email" required />
      <input type="password" placeholder="Contraseña" [(ngModel)]="password" name="password" required />
      <button type="submit" [disabled]="loading">Crear cuenta</button>
    </form>
    <div *ngIf="error" class="error">{{ error }}</div>
    <p>
      ¿Ya tienes una cuenta? 
      <a href="/login">Iniciar sesión</a>
    </p>
    <div class="auth-links">
      <a href="/" class="back-home">Volver a inicio</a>
    </div>
  </div>
</div>
