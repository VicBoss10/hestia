<div class="camera-container">
  <h2>Control de Detección de Gestos</h2>
  <p>
    Usa los botones para iniciar o detener el servicio de reconocimiento de gestos.
    El video se mostrará abajo cuando esté activo.
  </p>

  <div class="video-wrapper">
    <!-- El stream de video se mostrará aquí -->
    <img [src]="videoStreamUrl" alt="Video Stream" width="100%">
  </div>

  <div class="buttons">
    <button (click)="startStreaming()" [disabled]="isStreaming">▶️ Iniciar Detección</button>
    <button (click)="stopStreaming()" [disabled]="!isStreaming">⏹️ Detener Detección</button>
  </div>
</div>
